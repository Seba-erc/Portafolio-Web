<body>

<!-- ======================= PANTALLA DE LOGIN ======================= -->
<div id="login-screen">
  <div class="login-box">
    <span class="mdi mdi-library login-icon"></span>
    <h1 class="login-title">Sistema de Bibliotecas</h1>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <input type="text" id="txtUsername" placeholder=" " autocomplete="off">
        <label for="txtUsername">Nombre de Usuario</label>
      </div>
      <div class="field">
        <input type="password" id="txtPassword" placeholder=" " autocomplete="off">
        <label for="txtPassword">Contraseña</label>
      </div>

      <button type="submit" class="btn btn-raised btn-block" id="btnLogin">INGRESAR</button>
      <p id="txtError" class="login-error" hidden>Credenciales inválidas.</p>
    </form>

    <div class="demo-hint">
      <span class="mdi mdi-information-outline"></span>
      <div>
        <strong>Credenciales de demostración</strong>
        <div><code>admin</code> / <code>admin123</code> — Administrador</div>
        <div><code>operador</code> / <code>op123</code> — Operador</div>
      </div>
    </div>
  </div>
</div>

<!-- ======================= APLICACIÓN PRINCIPAL ======================= -->
<div id="app" hidden>
  <div class="mobile-topbar" id="mobileTopbar">
    <button class="btn-icon" id="btnToggleSidebar" style="color:#fff"><span class="mdi mdi-menu"></span></button>
    <span class="mdi mdi-library"></span>
    <span class="title">Sistema de Bibliotecas</span>
  </div>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell">

    <!-- Menú lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <span class="mdi mdi-account-circle profile-icon"></span>
        <div class="profile-name" id="txtUserName">Nombre Usuario</div>
        <div class="profile-role" id="txtUserRole">Rol</div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-btn" data-nav="dashboard" id="btnNavDashboard">Dashboard</button>
        <button class="nav-btn" data-nav="libros" id="btnNavLibros">Gestión de Libros</button>
        <button class="nav-btn" data-nav="lectores" id="btnNavLectores">Gestión de Lectores</button>
        <button class="nav-btn" data-nav="prestamos" id="btnNavPrestamos">Préstamos y Reservas</button>
        <button class="nav-btn" data-nav="multas" id="btnNavMultas">Multas y Morosos</button>
        <button class="nav-btn" data-nav="configuracion" id="btnNavConfiguracion">Configuración</button>

        <div class="nav-separator"></div>

        <button class="nav-btn" data-nav="usuarios" id="btnNavUsuarios">Gestión de Empleados</button>
        <button class="nav-btn" data-nav="auditoria" id="btnNavAuditoria">Auditoría / Logs</button>

        <div class="nav-separator"></div>

        <button class="nav-btn" data-nav="backup" id="btnNavBackup">Respaldar Base de Datos</button>
        <button class="nav-btn" data-nav="logout" id="btnNavLogout">Cerrar Sesión</button>
      </nav>
    </aside>

    <!-- Contenido principal (equivalente al Frame de MainWindow) -->
    <main id="main-content"></main>
  </div>
</div>

<!-- ======================= CONTENEDORES DINÁMICOS ======================= -->
<div id="modal-root"></div>
<div id="msgbox-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
